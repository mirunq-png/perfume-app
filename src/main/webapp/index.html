<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfume Collection</title> <!--name in taskbar-->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="form-container">
    <h1>Welcome!</h1>
    <div class="horizontal-menu">
        <a href="collection.html"><button>View collection</button></a>
        <a href="filter.html"><button>Filter/Search collection</button></a>
    </div>
    <img id="welcome-image" alt="Perfume illustration" class="welcome-image"> <!--alt in case the img loading breaks-->
</div>
<script>
    const perfumeImages = [
        'img/image1.png',
        'img/image2.png',
        'img/image3.png'
    ];
    const randomIndex = Math.floor(Math.random() * perfumeImages.length);
    const chosenImage = perfumeImages[randomIndex];
    document.getElementById('welcome-image').src = chosenImage;
</script>
</body>
</html>

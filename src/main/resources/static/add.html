<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Perfume</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-container">
    <h1>Add a New Perfume</h1>

    <details class="form-container">
        <summary class="autofill-summary">
            Optional: Autofill from Fragrantica
        </summary>
        <br>
        <div class="autofill-container">
            <div class="autofill-group">
                <input type="url" id="scraperUrl" placeholder="https://www.fragrantica.com/perfume/..." />
                <button type="button" id="btnFetch" onclick="fetchFragranticaData()">Load</button>
            </div>
            <span id="autofillStatus" class="status-text"></span>
        </div>
    </details>
    <br>

    <form id="perfumeForm">
        <div class="form-group">
            <label for="name">Perfume name*</label>
            <input type="text" id="name">
        </div>

        <div class="form-group">
            <label for="existingBrand">Brand name*</label>
            <select id="existingBrand" onchange="checkBrandSelection()">
                <option value="">Loading...</option>
                <option value="NEW">[+] Add a new brand...</option>
            </select>
        </div>

        <div class="form-group hidden" id="newBrandContainer">
            <label for="newBrand">New brand name *</label>
            <input type="text" id="newBrand">
        </div>

        <div class="form-group">
            <label for="ml">Amount (ml)*</label>
            <select id="ml">
                <option value="2">2 ml</option>
                <option value="5">5 ml</option>
                <option value="10">10 ml</option>
                <option value="30">30 ml</option>
                <option value="50">50 ml</option>
                <option value="80">80 ml</option>
                <option value="90">90 ml</option>
                <option value="100" selected>100 ml</option>
            </select>
        </div>

        <div class="form-group">
            <label for="type">Type*</label>
            <select id="type">
                <option value="EDP">Eau de parfum</option>
                <option value="ETP">Eau de toilette</option>
                <option value="BM">Body mist</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topNotes">Top notes (comma separated)</label>
            <input type="text" id="topNotes" placeholder="e.g. strawberry, lemon">
        </div>

        <div class="form-group">
            <label for="heartNotes">Heart notes (comma separated)</label>
            <input type="text" id="heartNotes" placeholder="e.g. orange blossom">
        </div>

        <div class="form-group">
            <label for="baseNotes">Base notes (comma separated)*</label>
            <input type="text" id="baseNotes" required, placeholder="e.g. marshmallow, musk">
        </div>

        <div class="form-group">
            <label>Seasons*</label>
            <div id="seasons-container">
                <input type="checkbox" value="WINTER"> Winter
                <input type="checkbox" value="SPRING"> Spring
                <input type="checkbox" value="SUMMER"> Summer
                <input type="checkbox" value="FALL"> Fall
            </div>
        </div>

        <div class="form-group">
            <label for="rating">Rating*</label>
            <input type="text" id="rating" required, placeholder="e.g. 9.5">
        </div>
        <button type="submit">Save perfume</button>
    </form>
</div>
<br>
<div style="display: flex; flex-direction: row; gap: 12px; margin-top: 20px;"> <!--all this work so they are next to each other-->
    <button onclick="window.location.href='collection.html'">Back to your collection</button>
    <button onclick="window.location.href='index.html'">Back to main menu</button>
</div>
<script src="js/utility.js"></script>
<script src="js/add.js"></script>
</body>
</html>
